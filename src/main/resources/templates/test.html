<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Calculator')}"></head><body><header th:replace="~{layout :: nav}"></header><main class="container py-5"><p class="eyebrow">BONUS / JUNIT + MOCKMVC</p><h1>Four-operation calculator</h1><p class="lead">Precise decimal arithmetic with server-side validation.</p><div th:replace="~{layout :: alerts}"></div><form th:action="@{/test}" method="post" class="card card-body filter"><label>First number<input class="form-control" name="a" type="number" step="any" value="12" required></label><label>Operation<select class="form-select" name="operation"><option value="add">Add +</option><option value="subtract">Subtract −</option><option value="multiply">Multiply ×</option><option value="divide">Divide ÷</option></select></label><label>Second number<input class="form-control" name="b" type="number" step="any" value="3" required></label><button class="btn btn-success">Calculate</button></form><div class="result" th:if="${result != null}">Result <strong th:text="${result}"></strong></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
