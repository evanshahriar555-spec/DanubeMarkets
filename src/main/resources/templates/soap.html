<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('MNB exchange rates')}"></head><body><header th:replace="~{layout :: nav}"></header><main class="container py-5"><p class="eyebrow">OFFICIAL DATA / SOAP CLIENT</p><h1>MNB exchange rates</h1><p class="lead">Explore Hungarian forint exchange rates over time.</p><div th:replace="~{layout :: alerts}"></div><form class="card card-body filter" method="get"><label>Currency<select class="form-select" name="currency"><option th:each="v : ${ {'EUR','USD','GBP','CHF','JPY','PLN','CZK','AUD','CAD'} }" th:value="${v}" th:text="${v}" th:selected="${v == currency}"></option></select></label><label>Start date<input class="form-control" type="date" name="start" th:value="${start}" required></label><label>End date<input class="form-control" type="date" name="end" th:value="${end}" required></label><button class="btn btn-success">Load exchange rates</button></form><section th:if="${rates != null}" class="mt-4"><p th:if="${#lists.isEmpty(rates)}" class="alert alert-info">No published rates in this interval. Try business days.</p><div class="chart-panel" th:unless="${#lists.isEmpty(rates)}"><canvas id="ratesChart"></canvas></div><div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Currency</th><th>Quoted units</th><th>HUF per quoted units</th></tr></thead><tbody><tr th:each="r : ${rates}"><td th:text="${r.date}"></td><td th:text="${r.currency}"></td><td th:text="${r.unit}"></td><td th:text="${r.value}"></td></tr></tbody></table></div></section></main><footer th:replace="~{layout :: footer}"></footer><script src="/vendor/chart.umd.js"></script><script th:inline="javascript">const dates=/*[[${dates}]]*/ [];const values=/*[[${values}]]*/ [];if(document.getElementById('ratesChart'))new Chart(document.getElementById('ratesChart'),{type:'line',data:{labels:dates,datasets:[{label:'HUF per 1 currency unit',data:values,borderColor:'#51e1bc',backgroundColor:'#51e1bc22',fill:true,tension:.2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#ddd'}}},scales:{x:{ticks:{color:'#aaa'}},y:{ticks:{color:'#aaa'}}}}});</script></body></html>
